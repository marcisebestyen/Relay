name: relay-infrastructure

services:
  relay-postgres:
    image: postgres:17
    container_name: relay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in relay-infrastructure/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in relay-infrastructure/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in relay-infrastructure/.env}
    ports:
      - "5432:5432"
    volumes:
      - relay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  relay-postgres-data:
